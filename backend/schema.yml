    VariantList:
      type: object
      description: |-
        Lightweight serializer for variant listing page.

        Used in: GET /api/v1/products/ (product listing)
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sku:
          type: string
        full_name:
          type: string
        product_name:
          type: string
        product_slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        mrp:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        discount_percentage:
          type: integer
        unit:
          type: string
        unit_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        image_url:
          type: string
          readOnly: true
        in_stock:
          type: string
          readOnly: true
        available_quantity:
          type: integer
        vendor_name:
          type: string
        avg_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          nullable: true
        review_count:
          type: integer
      required:
      - available_quantity
      - avg_rating
      - discount_percentage
      - full_name
      - id
      - image_url
      - in_stock
      - mrp
      - price
      - product_name
      - product_slug
      - review_count
      - sku
      - unit
      - unit_value
      - vendor_name
    Vendor:
      type: object
      description: Full serializer for Vendor.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserList'
          readOnly: true
        business_name:
          type: string
          maxLength: 255
        commission_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        is_approved:
          type: boolean
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        product_count:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approved_at
      - business_name
      - commission_rate
      - created_at
      - id
      - product_count
      - updated_at
      - user
    VendorList:
      type: object
      description: Lightweight serializer for vendor lists.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business_name:
          type: string
          maxLength: 255
        is_approved:
          type: boolean
      required:
      - business_name
      - id
    VendorPayoutStatusEnum:
      enum:
      - PENDING
      - PAID
      - FAILED
      - REFUNDED
      type: string
      description: |-
        * `PENDING` - Pending
        * `PAID` - Paid
        * `FAILED` - Failed
        * `REFUNDED` - Refunded
    VerifyEmail:
      type: object
      description: Email address verification with confirmation key.
      properties:
        key:
          type: string
          writeOnly: true
        detail:
          type: string
          readOnly: true
      required:
      - detail
      - key
    WebhookEvent:
      type: object
      description: Serializer for WebhookEvents.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event_type:
          type: string
          maxLength: 255
        payload: {}
        processed:
          type: boolean
        processing_error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
