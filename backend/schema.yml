          type: boolean
        is_staff:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - full_name
      - id
      - phone
      - updated_at
    UserList:
      type: object
      description: Lightweight serializer for user lists.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        full_name:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - full_name
      - id
      - phone
    Vendor:
      type: object
      description: Full serializer for Vendor.
