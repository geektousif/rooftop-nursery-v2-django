        business_name:
          type: string
          maxLength: 255
        commission_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        is_approved:
          type: boolean
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        product_count:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approved_at
      - business_name
      - commission_rate
      - created_at
      - id
      - product_count
      - updated_at
      - user
    VendorList:
      type: object
      description: Lightweight serializer for vendor lists.
      properties:
        id:
