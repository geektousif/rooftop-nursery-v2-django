components:
  schemas:
    ActionTypeEnum:
      enum:
      - sale
      - restock
      - return
      - adjustment
      - reserve
      type: string
      description: |-
        * `sale` - Sale
        * `restock` - Restock
        * `return` - Return
        * `adjustment` - Adjustment
        * `reserve` - Reserve
    Address:
      type: object
      description: Serializer for Address.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: '#/components/schemas/TypeEnum'
        full_name:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        address:
          type: string
        city:
          type: string
          nullable: true
          maxLength: 255
        state:
          type: string
          nullable: true
          maxLength: 255
        country:
          type: string
          nullable: true
          maxLength: 255
        pin_code:
          type: string
          maxLength: 6
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - created_at
      - full_name
      - id
      - phone
      - pin_code
      - type
      - updated_at
    Banner:
      type: object
      description: Serializer for Banner.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          nullable: true
          maxLength: 100
        image_url:
          type: string
          format: uri
          maxLength: 200
        mobile_image_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        link_url:
          type: string
          format: uri
          maxLength: 200
        position_type:
          $ref: '#/components/schemas/PositionTypeEnum'
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - image_url
      - link_url
      - position_type
      - sort_order
      - start_date
      - updated_at
    Coupon:
      type: object
      description: Serializer for Coupon.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 50
        description:
          type: string
        discount_type:
          $ref: '#/components/schemas/DiscountTypeEnum'
        discount_value:
          type: number
          format: double
        min_order_amount:
          type: number
          format: double
        max_discount_amount:
          type: number
          format: double
          nullable: true
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        usage_limit:
          type: integer
          maximum: 2147483647
          minimum: 0
        usage_limit_per_user:
          type: integer
          maximum: 2147483647
          minimum: 0
        applies_to_all_products:
          type: boolean
        applies_to_specific_products:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariantList'
          readOnly: true
        product_variant_ids:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
        is_active:
          type: boolean
        is_valid:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - applies_to_specific_products
      - code
      - created_at
      - description
      - discount_type
      - discount_value
      - end_date
      - id
      - is_valid
      - min_order_amount
      - start_date
      - updated_at
      - usage_limit
      - usage_limit_per_user
    CouponList:
      type: object
      description: Lightweight serializer for coupon lists.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 50
        description:
          type: string
        discount_type:
          $ref: '#/components/schemas/DiscountTypeEnum'
        discount_value:
          type: number
          format: double
        min_order_amount:
          type: number
          format: double
        is_active:
          type: boolean
        is_valid:
          type: string
          readOnly: true
      required:
      - code
      - description
      - discount_type
      - discount_value
      - id
      - is_valid
      - min_order_amount
    Customer:
      type: object
      description: Full serializer for Customer.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserList'
          readOnly: true
        is_active:
          type: boolean
        is_guest:
          type: boolean
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
          readOnly: true
        order_count:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - addresses
      - created_at
      - id
      - order_count
      - updated_at
      - user
    CustomerList:
      type: object
      description: Lightweight serializer for customer lists.
