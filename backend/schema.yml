      - created_at
      - event_type
      - id
      - payload
      - updated_at
    WebhookEventList:
      type: object
      description: Lightweight serializer for webhook event lists.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event_type:
          type: string
          maxLength: 255
        processed:
          type: boolean
