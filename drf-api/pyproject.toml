[project]
name = "drf-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.1",
    "django-cors-headers>=4.9.0",
    "django-debug-toolbar>=6.2.0",
    "django-environ>=0.12.0",
    "django-fast-treenode>=3.2.6",
    "django-filter>=25.2",
    "django-phonenumber-field[phonenumbers]>=8.4.0",
    "django-silk>=5.4.3",
    "djangorestframework>=3.16.1",
    "drf-auth-kit>=1.1.3",
    "drf-spectacular>=0.29.0",
    "drf-spectacular-sidecar>=2026.1.1",
    "drf-standardized-errors[openapi]>=0.15.0",
    "imagekitio>=5.2.0",
    "psycopg[binary]>=3.3.2",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "django-silk[formatting]>=5.4.3",
    "ruff>=0.14.14",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | migrations
  | __pycache__
)/
'''

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--cov=apps --cov-report=html --cov-report=term"
